# Refreshes the app's stored information from the district's websites.
#
# Runs on GitHub's computers, not yours — nothing needs to be switched on at
# home. It reads the district and school pages, checks the answers against the
# question list, and only updates the live app if every check passes.
#
# The fast-changing things (closings, calendar dates) are read live by the app
# itself every time someone opens it, so this job only refreshes the slow
# stuff: pages, school hours, phone numbers.

name: Refresh school information

on:
  schedule:
    # 06:20 UTC on the 1st of each month — about 1:20am in New Jersey, when
    # the district's servers are quiet.
    - cron: "20 6 1 * *"

  workflow_dispatch:        # the Run workflow button on the Actions tab

  # A refresh can also be started by changing this one file. Starting a job
  # through GitHub's own button needs an access key for the account, which
  # Claude does not have and should not be given; pushing a file is something
  # it can already do. Nothing else in the project touches this file, so an
  # ordinary publish never sets a refresh going by accident.
  push:
    paths:
      - ".refresh-now"

permissions:
  contents: write           # so it can save the refreshed information back

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Windows, because the tooling uses Windows PowerShell's JSON reader.
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Read the district's pages
        shell: powershell
        run: |
          ./tools/ingest/Prefetch-Pages.ps1 -Concurrency 6

      - name: Sort them into the app's information
        shell: powershell
        run: |
          # Deliberately NOT -Offline. The previous step saves the district's
          # pages, but the calendar feeds and the district homepage are not
          # pages and are not saved by it. Offline-only meant this step had
          # nothing to read and stopped. Left online, it uses the saved pages
          # and fetches only the two dozen things that are missing.
          ./tools/ingest/Build-KnowledgePack.ps1

      - name: Check the answers are still right
        shell: powershell
        run: |
          ./tools/tests/Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Answer checks failed - not publishing." }
          ./tools/tests/Run-AlertTests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Closing-alert checks failed - not publishing." }

      - name: Put the new information into the app
        shell: powershell
        run: |
          $pack  = "tools/dist/knowledge-pack.json"
          $rules = "tools/ingest/rules/intents.json"
          if (-not (Test-Path $pack)) { throw "No information file was produced." }

          # A sanity floor: never replace good data with an empty file.
          $p = Get-Content $pack -Raw | ConvertFrom-Json
          if ($p.schools.Count -lt 15)  { throw "Only $($p.schools.Count) schools found - refusing to publish." }
          if ($p.calendar.Count -lt 50) { throw "Only $($p.calendar.Count) calendar entries - refusing to publish." }
          if ($p.bells.Count -lt 3)     { throw "Only $($p.bells.Count) bell schedules - refusing to publish." }

          New-Item -ItemType Directory -Path data -Force | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::WriteAllText("data/pack.js",
            "// Generated by the monthly refresh - do not edit.`nwindow.PACK = " + (Get-Content $pack -Raw) + ";`n", $utf8)
          [IO.File]::WriteAllText("data/rules.js",
            "// Generated by the monthly refresh - do not edit.`nwindow.RULES = " + (Get-Content $rules -Raw) + ";`n", $utf8)

          # Rebuild the page from its source fragment.
          $frag = Get-Content "tools/web/page.html" -Raw
          $i = $frag.IndexOf('<header')
          $html = "<!doctype html>`n<html lang=""en"">`n<head>`n<meta charset=""utf-8"">`n" +
                  "<meta name=""viewport"" content=""width=device-width, initial-scale=1, viewport-fit=cover"">`n" +
                  $frag.Substring(0, $i) + "`n</head>`n<body>`n" + $frag.Substring($i) + "`n</body>`n</html>`n"
          [IO.File]::WriteAllText("index.html", $html, $utf8)
          Copy-Item "index.html" "404.html" -Force
          foreach ($f in @("engine.js", "app.js", "manifest.webmanifest", "icon.svg")) {
            Copy-Item "tools/web/$f" $f -Force
          }

          # Stamp the build into the offline rules, so phones that already have
          # the app pick up this refresh instead of keeping the old files.
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMddHHmmss')
          $sw = (Get-Content "tools/web/sw.js" -Raw).Replace('__BUILD__', $stamp)
          [IO.File]::WriteAllText("sw.js", $sw, $utf8)

      - name: Publish it
        shell: powershell
        run: |
          git config user.name  "Edison Parent App"
          git config user.email "edison-parent@users.noreply.github.com"
          git add -A ":!tools/.cache"
          $changed = git status --porcelain
          if (-not $changed) {
            Write-Host "Nothing changed on the district's websites this month."
            exit 0
          }
          git commit -m "Monthly refresh of school information"
          git push
          Write-Host "Published."
