# Builds the iPhone app and runs its checks, on a Mac.
#
# This project was written on a Windows machine, so until now the iPhone app
# had never once been compiled - the Swift was written against a contract and
# checked only by the PowerShell version of the same engine agreeing with it.
# Code nobody has compiled is not code that works; it is a guess.
#
# GitHub lends public projects a real Mac for free, which is the whole reason
# this file can exist. It compiles the app and runs its tests on an iPhone
# simulator, every time anything in the iPhone app changes.
#
# It does NOT sign anything or send anything to Apple. Signing needs a paid
# Apple developer account, which is the owner's to set up, and nothing here
# should be able to publish on its own.

name: Build the iPhone app

on:
  workflow_dispatch:

  push:
    paths:
      - "tools/ios/**"
      - ".github/workflows/ios-build.yml"
      - ".build-ios-now"

permissions:
  # Only so it can write down what failed. GitHub keeps the full log behind
  # a sign-in, and the person maintaining this has none, so a build that
  # fails silently is a build nobody can fix. One file, committed back.
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Which Xcode and which simulators
        run: |
          xcodebuild -version
          echo "--- available iPhone simulators ---"
          xcrun simctl list devices available | grep -i iphone || true

      - name: Build it
        working-directory: tools/ios
        run: |
          set -o pipefail
          # No signing: this only has to compile and run in a simulator.
          # A simulator build needs no certificate and no Apple account.
          xcodebuild \
            -project EdisonParent.xcodeproj \
            -scheme EdisonParent \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Run its checks
        working-directory: tools/ios
        run: |
          set -o pipefail
          # Pick whatever iPhone this runner actually has rather than naming
          # a model, which goes stale every time Apple ships a new one.
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          echo "Testing on simulator $DEVICE"
          xcodebuild \
            -project EdisonParent.xcodeproj \
            -scheme EdisonParent \
            -configuration Debug \
            -destination "id=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Photograph the app for the App Store
        if: always()
        working-directory: tools/ios
        run: |
          # Apple needs at least one iPhone screenshot at a size it names, and
          # the owner of this project has neither a Mac nor an iPhone. The
          # simulator here is a real iPhone as far as the app is concerned, so
          # the picture it takes is a real screenshot at exactly the pixel
          # size Apple asks for - not a mock-up and not something stretched.
          #
          # Prefer a Dynamic Island iPhone: 1179x2556 and 1206x2622 are the
          # sizes App Store Connect lists as required.
          #
          # Shell only, deliberately. An earlier version embedded a Python
          # script here, and its unindented lines ended this block early and
          # made the whole workflow file invalid YAML - so it never ran at
          # all, silently, which looked exactly like a slow build.
          set +e
          LIST=$(xcrun simctl list devices available)
          UDID=""
          MODEL=""
          for M in "iPhone 16 Pro" "iPhone 15 Pro" "iPhone 16" "iPhone 15"; do
            LINE=$(echo "$LIST" | grep -F "$M (" | head -1)
            if [ -n "$LINE" ]; then
              UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
              MODEL="$M"
              break
            fi
          done
          if [ -z "$UDID" ]; then
            LINE=$(echo "$LIST" | grep -F "iPhone" | head -1)
            UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
            MODEL=$(echo "$LINE" | sed -E 's/^[[:space:]]*(.*) \([0-9A-Fa-f-]{36}\).*/\1/')
          fi
          if [ -z "$UDID" ]; then echo "No iPhone simulator; skipping."; exit 0; fi
          echo "Using $MODEL ($UDID)"

          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "No built app to photograph; skipping."; exit 0; fi
          echo "App at $APP"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Launching $BUNDLE"
          xcrun simctl launch "$UDID" "$BUNDLE"
          # The first screen builds its list and checks the live feed; give it
          # a moment so the picture is of the app, not of a blank frame.
          sleep 15

          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot --type=png screenshots/iphone-1-home.png
          xcrun simctl shutdown "$UDID"

          if [ -f screenshots/iphone-1-home.png ]; then
            W=$(sips -g pixelWidth screenshots/iphone-1-home.png | awk '/pixelWidth/ {print $2}')
            H=$(sips -g pixelHeight screenshots/iphone-1-home.png | awk '/pixelHeight/ {print $2}')
            echo "${W}x${H} on ${MODEL}" > screenshots/SIZE.txt
            cat screenshots/SIZE.txt
          else
            echo "simctl took no picture."
          fi
          exit 0
      - name: Keep the screenshots where they can be downloaded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: tools/ios/screenshots
          if-no-files-found: ignore
          retention-days: 30

      - name: Write down what happened
        if: always()
        working-directory: tools/ios
        run: |
          OUT=ios-build-result.txt
          {
            echo "iPhone app build - $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Xcode: $(xcodebuild -version | head -1)"
            echo ""
            if grep -q "BUILD SUCCEEDED" build.log 2>/dev/null; then
              echo "COMPILED: yes"
            else
              echo "COMPILED: no"
            fi
            echo ""
            echo "--- anything the compiler objected to ---"
            grep -E "(error|warning): " build.log 2>/dev/null | sed 's|.*/tools/ios/||' | sort -u | head -40 || echo "(none)"
            echo ""
            echo "--- checks that failed ---"
            # The contract test reports every failing case - the question, what
            # was expected, what came back, and which resolver handled it. That
            # detail spans several lines, so grep alone would keep only the
            # first one and throw away the part worth reading. Print the whole
            # block, from the failure line to the end of that test case.
            if grep -q "error: -\[" test.log 2>/dev/null; then
              sed -n '/error: -\[/,/^[[:space:]]*Test Case .*failed (/p' test.log \
                | sed 's|.*/tools/ios/||' | head -400
            else
              echo "(none)"
            fi
            echo ""
            echo "--- did the tests themselves build? ---"
            # A test file that does not compile means the checks never ran.
            # Without this the report said "(none) failed" and looked green,
            # which is worse than saying nothing: 9 fast tests passing is not
            # the same as the 100-question contract passing.
            if grep -qE "^.*\.swift:[0-9]+:[0-9]+: error: " test.log 2>/dev/null; then
              echo "NO - the test code failed to compile:"
              grep -E "^.*\.swift:[0-9]+:[0-9]+: error: " test.log \
                | sed 's|.*/tools/ios/||' | sort -u | head -30
            else
              echo "yes"
            fi
            echo ""
            echo "--- did the 100-question contract actually run? ---"
            if grep -q "testQuestionContract" test.log 2>/dev/null; then
              grep -E "Test Case .*testQuestionContract.* (passed|failed)" test.log \
                | sed 's|.*/tools/ios/||' | tail -2
            else
              echo "NO - it never ran. Everything above is about other checks."
            fi
            echo ""
            echo "--- did the 1.3 checks run? ---"
            for t in testAWholeBreakGetsOneReminder \
                     testADayAlreadyAnnouncedOnTheFeedIsLeftAlone \
                     testTheTimesTablesAreActuallyCorrect \
                     testAddingASetMakesAFreshDeckOfItsOwn; do
              line=$(grep -E "Test Case .*$t.* (passed|failed)" test.log 2>/dev/null | tail -1)
              if [ -n "$line" ]; then
                echo "$line" | sed 's|.*/tools/ios/||'
              else
                echo "$t - NEVER RAN"
              fi
            done
            echo ""
            echo "--- App Store screenshot ---"
            if [ -f screenshots/SIZE.txt ]; then
              echo "captured $(cat screenshots/SIZE.txt)"
              echo "on the site at store/screenshots-iphone/"
            else
              echo "(none captured)"
            fi
            echo ""
            echo "--- totals ---"
            grep -E "Executed [0-9]+ test" test.log 2>/dev/null | tail -3 || echo "(tests did not run)"
          } > "$OUT"
          echo "::group::result"
          cat "$OUT"
          echo "::endgroup::"

      - name: Leave it where it can be read without signing in
        if: always()
        run: |
          git config user.name  "Edison Parent App"
          git config user.email "edison-parent@users.noreply.github.com"
          cp tools/ios/ios-build-result.txt ios-build-result.txt
          git add ios-build-result.txt

          # The screenshot goes on the website too, not only into a build
          # artifact: artifacts need a GitHub sign-in and a hunt through a
          # logs page, and the person who needs this file is filling in a
          # form on App Store Connect with a phone in their hand.
          if [ -d tools/ios/screenshots ]; then
            mkdir -p store/screenshots-iphone
            cp tools/ios/screenshots/*.png store/screenshots-iphone/ 2>/dev/null || true
            cp tools/ios/screenshots/SIZE.txt store/screenshots-iphone/ 2>/dev/null || true
            git add store/screenshots-iphone || true
          fi
          if git diff --cached --quiet; then
            echo "Same result as last time; nothing to record."
            exit 0
          fi
          git commit -m "iPhone app build result"
          # Someone may have pushed while this ran; take their work and add
          # this on top rather than refusing or, worse, overwriting it.
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Keep the full logs too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            tools/ios/build.log
            tools/ios/test.log
          if-no-files-found: ignore
          retention-days: 14
