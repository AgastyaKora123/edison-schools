# Fallback project definition for XcodeGen.
#
# EdisonParent.xcodeproj is checked in and should open directly in Xcode 16 or
# later (it uses file-system synchronized groups, so new .swift files are
# picked up with no project edit).
#
# If that project ever fails to open - an older Xcode, a merge conflict, a
# corrupted pbxproj - regenerate it instead of repairing it by hand:
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# Both routes produce the same two targets and the same bundled resources.

name: EdisonParent
options:
  bundleIdPrefix: io.github.agastyakora123
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  EdisonParent:
    type: application
    platform: iOS
    sources:
      - path: EdisonParent
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Schoolo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Background checks for closings posted to the district's live feed.
        INFOPLIST_KEY_UIBackgroundModes: fetch
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: io.github.agastyakora123.schoolanswers.checkClosings
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.agastyakora123.schoolanswers
        TARGETED_DEVICE_FAMILY: "1"

  EdisonParentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EdisonParentTests
    dependencies:
      - target: EdisonParent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.agastyakora123.schoolanswersTests

schemes:
  EdisonParent:
    build:
      targets:
        EdisonParent: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EdisonParentTests
